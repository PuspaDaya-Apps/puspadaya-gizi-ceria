  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Load external script asynchronously after main app -->
    <script>
      // Load GPTEngineer script asynchronously to prevent blocking
      if ('scriptLoader' in window === false) {
        window.scriptLoader = true;
        window.addEventListener('load', function() {
          const script = document.createElement('script');
          script.src = 'https://cdn.gpteng.co/gptengineer.js';
          script.type = 'module';
          script.async = true;
          
          // Error handling untuk script eksternal
          script.onerror = function() {
            console.warn('GPTEngineer script failed to load, continuing without it');
          };
          
          script.onload = function() {
            console.log('GPTEngineer script loaded successfully');
          };
          
          document.body.appendChild(script);
        });
      }
    </script>
  </body>
